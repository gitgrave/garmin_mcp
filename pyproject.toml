[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project]
name = "garmin-mcp"
version = "0.1.0"
description = "MCP server to access Garmin data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv==1.2.2",
    "garminconnect>=0.3.6",
    "requests==2.33.0",
    "mcp>=1.28.1",
    "fitparse>=1.2.0",
]

[project.scripts]
garmin-mcp = "garmin_mcp:main"
garmin-mcp-auth = "garmin_mcp.auth_cli:main"

[tool.uv.sources]
# Local editable checkout of the fork that adds update_workout. Sibling repo
# under the same parent dir. Swap for a git tag or PyPI release once the
# python-garminconnect change is upstreamed/published.
garminconnect = { path = "../python-garminconnect", editable = true }

[tool.uv]
dev-dependencies = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.2",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.3.1",
]

